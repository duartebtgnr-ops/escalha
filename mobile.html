<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escala Operadores de Trânsito</title>
  <link rel="manifest" href="data:application/json,{%22name%22:%22Escala%20Operadores%20Tr%C3%A2nsito%22,%22short_name%22:%22Escala2026%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121829%22,%22theme_color%22:%22%231e293b%22}">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    h1 { font-size: 1.25rem; color: #38bdf8; margin-top: 0; }
    .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Escala Operadores de Trânsito</h1>
    <p>Consulte os seus turnos, trocas e férias em tempo real com suporte offline.</p>
    <button class="btn" onclick="location.reload()">Atualizar Dados</button>
  </div>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const swCode = `
        const CACHE_NAME = 'escala-v2026-v6';
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Registration:', err));
    });
  }
  </script>
</body>
</html>
