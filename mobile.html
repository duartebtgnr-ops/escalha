<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Escala Trânsito 2026</title>
<style>
  :root {
    --navy:#1E2D45; --green:#27AE60; --orange:#E67E22; --red:#C0392B;
    --blue:#3D82C4; --purple:#8B5CA5; --bg:#F4F6F9; --card:#fff;
    --border:#D1DBE8; --muted:#7A8A9A; --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.08);
    --tab-h:64px; --header-h:56px;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:#1A2233; overflow-x:hidden; padding-top:var(--header-h); }

  /* HEADER */
  .header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--navy); color:#fff; display:flex; align-items:center; padding:0 16px; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .header-title { font-size:.95rem; font-weight:700; flex:1; }
  .header-badge { background:rgba(255,255,255,.15); border-radius:8px; padding:4px 10px; font-size:.7rem; font-weight:700; }
  .header-update { font-size:.65rem; color:rgba(255,255,255,.6); margin-top:1px; }

  /* BANNER */
  .banner { background:#fff; border-bottom:1px solid var(--border); box-shadow:0 2px 6px rgba(0,0,0,.06); margin-bottom:8px; border-radius:0; }
  .banner-row { display:flex; overflow-x:auto; scrollbar-width:none; }
  .banner-row::-webkit-scrollbar { display:none; }
  .banner-card { flex:1 1 0; padding:12px 14px; border-right:1px solid var(--border); min-width:110px; background:#fff; }
  .banner-label { font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }
  .banner-name { font-size:.95rem; font-weight:700; color:var(--navy); }
  .banner-sub { font-size:.68rem; color:var(--muted); margin-top:1px; }
  .banner-sit { background:#FFF8F0; border-top:1px solid #FFE0B2; display:none; }
  .banner-sit-card { flex:0 0 auto; padding:8px 12px; border-right:1px solid #FFE0B2; min-width:160px; }

  /* MAIN */
  .main { padding-bottom:calc(var(--tab-h) + 8px); min-height:100vh; }
  .main.with-sit { }

  /* TABS */
  .tabs { position:fixed; bottom:0; left:0; right:0; height:var(--tab-h); background:#fff; border-top:1px solid var(--border); display:flex; z-index:100; box-shadow:0 -2px 8px rgba(0,0,0,.06); }
  .tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:none; background:none; cursor:pointer; color:var(--muted); font-size:.58rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; transition:.15s; }
  .tab-btn.active { color:var(--navy); }
  .tab-btn .icon { font-size:1.4rem; }
  .tab-btn.active .icon { transform:scale(1.1); }

  /* PANEL */
  .panel { display:none; padding:12px; }
  .panel.active { display:block; }

  /* CARD */
  .card { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card-title { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:12px; }

  /* MILITARY PILLS */
  .mil-pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .mil-pill { padding:8px 14px; border-radius:50px; font-size:.8rem; font-weight:700; border:2px solid transparent; cursor:pointer; transition:.15s; }
  .mil-pill.active { border-color:currentColor; }
  .mil-pill.inactive { opacity:.45; }

  /* FORM */
  .form-row { display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .form-group label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:block; margin-bottom:4px; }
  .form-group input, .form-group select { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; font-size:.9rem; background:#fff; -webkit-appearance:none; }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--navy); }

  /* BUTTONS */
  .btn { padding:13px 20px; border-radius:12px; font-size:.88rem; font-weight:700; border:none; cursor:pointer; transition:.15s; width:100%; margin-bottom:8px; }
  .btn-primary { background:var(--navy); color:#fff; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-outline { background:#fff; color:var(--navy); border:1.5px solid var(--border); }
  .btn-small { padding:8px 16px; font-size:.78rem; width:auto; border-radius:8px; margin-bottom:0; }
  .btn-danger { background:none; color:var(--red); border:1.5px solid var(--red); }

  /* ENTRY CARDS */
  .entry-card { border-radius:12px; padding:14px 16px; margin-bottom:10px; border-left:4px solid; }
  .entry-sv { background:rgba(39,174,96,.08); border-color:var(--green); }
  .entry-f { background:rgba(139,92,165,.08); border-color:var(--purple); }
  .entry-lp { background:rgba(61,130,196,.08); border-color:var(--blue); }
  .entry-troca { background:rgba(230,126,34,.08); border-color:var(--orange); }
  .entry-name { font-size:.95rem; font-weight:700; }
  .entry-date { font-size:.75rem; color:var(--muted); margin-top:2px; }
  .entry-badge { display:inline-block; padding:3px 12px; border-radius:50px; font-size:.7rem; font-weight:700; margin-top:6px; }
  .badge-sv { background:var(--green); color:#fff; }
  .badge-f { background:var(--purple); color:#fff; }
  .badge-lp { background:var(--blue); color:#fff; }
  .badge-troca { background:var(--orange); color:#fff; }

  /* CALENDAR */
  .cal-month { margin-bottom:16px; }
  .cal-month-title { background:var(--navy); color:#fff; text-align:center; padding:8px; border-radius:10px 10px 0 0; font-size:.8rem; font-weight:700; letter-spacing:.08em; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; background:var(--border); border:1px solid var(--border); border-radius:0 0 10px 10px; overflow:hidden; }
  .cal-day-hdr { background:#EEF1F6; text-align:center; font-size:.65rem; font-weight:700; color:var(--muted); padding:5px 0; }
  .cal-day { background:#fff; min-height:52px; padding:3px; position:relative; cursor:pointer; }
  .cal-day.weekend { background:#F8F9FB; }
  .cal-day.feriado { background:#FFF8F0; }
  .cal-day.other-month { background:#F4F6F9; opacity:.5; }
  .cal-day-num { font-size:.7rem; font-weight:600; color:var(--muted); margin-bottom:2px; }
  .cal-dots { display:flex; flex-wrap:wrap; gap:1px; }
  .cal-dot { width:8px; height:8px; border-radius:2px; }

  /* SITUAÇÕES */
  .sit-card { border-radius:12px; padding:14px 16px; margin-bottom:10px; border-left:4px solid; background:#fff; box-shadow:var(--shadow); }
  .sit-badge { display:inline-block; padding:2px 10px; border-radius:50px; font-size:.68rem; font-weight:700; }
  .sit-pendente { background:#FFF3CD; color:#856404; }
  .sit-progresso { background:#CCE5FF; color:#004085; }
  .sit-concluida { background:#D4EDDA; color:#155724; }
  .sit-cancelada { background:#F8D7DA; color:#721c24; }

  /* FÉRIAS RESUMO */
  .fer-resumo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .fer-resumo-card { background:#fff; border-radius:12px; padding:12px 10px; box-shadow:var(--shadow); text-align:center; border-top:3px solid; }
  .fer-resumo-name { font-size:.68rem; font-weight:700; margin-bottom:4px; }
  .fer-resumo-dias { font-size:1.4rem; font-weight:700; color:var(--navy); }
  .fer-resumo-sub { font-size:.62rem; color:var(--muted); }
  .fer-bar { height:4px; border-radius:2px; background:#eee; margin-top:6px; }
  .fer-bar-fill { height:4px; border-radius:2px; }

  /* OVERLAY */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:flex-end; }
  .overlay.show { display:flex; }
  .overlay-box { background:#fff; border-radius:20px 20px 0 0; width:100%; padding:20px 16px 32px; max-height:90vh; overflow-y:auto; }
  .overlay-handle { width:40px; height:4px; background:#ddd; border-radius:2px; margin:0 auto 16px; }
  .overlay-title { font-size:1rem; font-weight:700; margin-bottom:16px; }

  /* LOADING */
  .loading { position:fixed; inset:0; background:rgba(255,255,255,.8); z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
  .loading.show { display:flex; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* MISC */
  .section-sep { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 8px; padding:0 4px; }
  .empty-state { text-align:center; padding:32px 16px; color:var(--muted); font-size:.85rem; }
  .info-box { border-radius:10px; padding:12px 14px; font-size:.8rem; margin-bottom:12px; }
  .info-blue { background:#EBF5FB; border-left:3px solid var(--blue); }
  .info-green { background:#EAFAF1; border-left:3px solid var(--green); }
  .info-orange { background:#FFF8F0; border-left:3px solid var(--orange); }
  .info-red { background:#FDF0F0; border-left:3px solid var(--red); }

  /* APROVAÇÃO OVERLAY */
  #approval-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; align-items:flex-end; }
  #approval-overlay.show { display:flex; }
  .approval-box { background:#fff; border-radius:20px 20px 0 0; width:100%; padding:24px 20px 40px; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading"><div class="spinner"></div><span style="font-size:.8rem;color:var(--muted)">A carregar...</span></div>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">⚖️ Operadores de Trânsito</div>
    <div class="header-update" id="last-update">A actualizar...</div>
  </div>
  <div class="header-badge" id="api-status">2026</div>
</div>

<!-- BANNER -->
<div id="banner-servico" style="background:#fff;border-bottom:2px solid #D1DBE8;display:block;width:100%">
  <div id="banner-servico-row" style="display:flex;overflow-x:auto;width:100%">
    <div style="flex:1;min-width:110px;padding:12px 14px;border-right:1px solid #D1DBE8">
      <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#E67E22;margin-bottom:3px">🔄 A Sair Hoje</div>
      <div id="b-saindo" style="font-size:.9rem;font-weight:700;color:#1A2233">A carregar...</div>
      <div id="b-saindo-sub" style="font-size:.65rem;color:#7A8A9A">—</div>
    </div>
    <div style="flex:1;min-width:110px;padding:12px 14px;border-right:1px solid #D1DBE8">
      <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#27AE60;margin-bottom:3px">⚡ Entra Hoje</div>
      <div id="b-hoje" style="font-size:.9rem;font-weight:700;color:#1A2233">A carregar...</div>
      <div id="b-hoje-sub" style="font-size:.65rem;color:#7A8A9A">—</div>
    </div>
    <div style="flex:1;min-width:110px;padding:12px 14px">
      <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#3D82C4;margin-bottom:3px">🔜 Amanhã</div>
      <div id="b-amanha" style="font-size:.9rem;font-weight:700;color:#1A2233">A carregar...</div>
      <div id="b-amanha-sub" style="font-size:.65rem;color:#7A8A9A">—</div>
    </div>
  </div>
  <div id="banner-sit-row" style="display:none;background:#FFF8F0;border-top:1px solid #FFE0B2;overflow-x:auto"></div>
</div>

<!-- MAIN CONTENT -->
<div class="main" id="main-content">

  <!-- ══ ESCALA ══ -->
  <div class="panel active" id="tab-escala">
    <div class="card">
      <div class="card-title">Filtrar</div>
      <div class="form-row">
        <div class="form-group"><label>Data Início</label><input type="date" id="start-date"></div>
        <div class="form-group"><label>Data Fim</label><input type="date" id="end-date"></div>
        <div class="form-group"><label>Tipo</label>
          <select id="filter-type">
            <option value="all">Todos</option>
            <option value="SV">Serviço</option>
            <option value="F">Férias</option>
            <option value="LP">Lic. Parental</option>
          </select>
        </div>
      </div>
      <div class="mil-pills" id="mil-pills"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="runConsulta()" style="flex:1">🔍 Consultar</button>
        <button class="btn btn-outline" onclick="exportPDFMobile()" style="flex:0 0 auto;width:auto;padding:13px 16px">📄 PDF</button>
      </div>
    </div>
    <div id="stats-container"></div>
    <div id="results-container"></div>
  </div>

  <!-- ══ CALENDÁRIO ══ -->
  <div class="panel" id="tab-calendario">
    <div class="card" style="padding:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <button onclick="changeMonth(-1)" style="background:none;border:none;font-size:1.4rem;cursor:pointer;padding:4px 8px;">‹</button>
        <div id="cal-month-label" style="font-size:.9rem;font-weight:700;color:var(--navy)"></div>
        <button onclick="changeMonth(1)" style="background:none;border:none;font-size:1.4rem;cursor:pointer;padding:4px 8px;">›</button>
      </div>
      <!-- legenda cor militares -->
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:.65rem" id="cal-legend"></div>
      <div id="cal-grid"></div>
    </div>
    <!-- detalhe dia -->
    <div id="cal-day-detail" style="display:none"></div>
  </div>

  <!-- ══ TROCAS ══ -->
  <div class="panel" id="tab-trocas">
    <button class="btn btn-primary" onclick="openOverlay('overlay-troca')">🔄 Novo Pedido de Troca</button>
    <div class="section-sep">Histórico</div>
    <div id="historico-trocas"><div class="empty-state">A carregar...</div></div>
  </div>

  <!-- ══ SITUAÇÕES ══ -->
  <div class="panel" id="tab-situacoes">
    <button class="btn btn-primary" onclick="openOverlay('overlay-situacao')">⚠️ Registar Situação</button>
    <div style="display:flex;gap:8px;margin:10px 0;overflow-x:auto;scrollbar-width:none;">
      <button class="btn btn-small btn-outline" onclick="filtrarSit('todas')" id="sf-todas" style="background:var(--navy);color:#fff;flex:0 0 auto">Todas</button>
      <button class="btn btn-small btn-outline" onclick="filtrarSit('Pendente')" id="sf-pendente" style="flex:0 0 auto">Pendentes</button>
      <button class="btn btn-small btn-outline" onclick="filtrarSit('Em Progresso')" id="sf-progresso" style="flex:0 0 auto">Em Progresso</button>
      <button class="btn btn-small btn-outline" onclick="filtrarSit('Concluída')" id="sf-concluida" style="flex:0 0 auto">Concluídas</button>
    </div>
    <div id="sit-lista"><div class="empty-state">A carregar...</div></div>
  </div>

  <!-- ══ FÉRIAS ══ -->
  <div class="panel" id="tab-ferias">
    <!-- Login -->
    <div id="ferias-login" class="card">
      <div class="card-title">Identificação</div>
      <div class="form-row">
        <div class="form-group"><label>Nome</label>
          <select id="fer-login-mil">
            <option value="">— Selecionar —</option>
            <option value="DUARTE">Flávio Duarte</option>
            <option value="REIS">Elder Reis</option>
            <option value="FINO">Rui Fino</option>
            <option value="MORGADO">António Morgado</option>
            <option value="NUNES">Carlos Nunes</option>
            <option value="AFONSO">Miguel Afonso</option>
          </select>
        </div>
        <div class="form-group"><label>Palavra-passe</label>
          <input type="password" id="fer-login-pwd" placeholder="••••••••">
        </div>
      </div>
      <button class="btn btn-primary" onclick="loginFerias()">Entrar</button>
    </div>
    <!-- Área logado -->
    <div id="ferias-area" style="display:none">
      <div class="info-box info-blue" style="display:flex;align-items:center;justify-content:space-between">
        <span id="ferias-user-info" style="font-size:.85rem;font-weight:700"></span>
        <button onclick="logoutFerias()" class="btn btn-small btn-outline" style="width:auto">Sair</button>
      </div>
      <div id="ferias-proximo" style="margin-bottom:12px"></div>
      <div class="fer-resumo-grid" id="ferias-resumo"></div>
      <div id="btn-ferias-area" style="margin-bottom:12px;display:none">
        <button class="btn btn-green" onclick="openOverlay('overlay-ferias')">🏖️ Marcar Férias</button>
      </div>
      <button class="btn btn-outline" onclick="exportFeriasPDF()" style="margin-bottom:12px">📄 Exportar PDF</button>
      <div id="ferias-lista"></div>
    </div>
  </div>

</div><!-- /main -->

<!-- BOTTOM TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('escala')" id="tbtn-escala"><span class="icon">📋</span>Escala</button>
  <button class="tab-btn" onclick="showTab('calendario')" id="tbtn-calendario"><span class="icon">📅</span>Calendário</button>
  <button class="tab-btn" onclick="showTab('trocas')" id="tbtn-trocas"><span class="icon">🔄</span>Trocas</button>
  <button class="tab-btn" onclick="showTab('situacoes')" id="tbtn-situacoes"><span class="icon">⚠️</span>Situações</button>
  <button class="tab-btn" onclick="showTab('ferias')" id="tbtn-ferias"><span class="icon">🏖️</span>Férias</button>
</div>

<!-- OVERLAYS -->
<!-- Troca -->
<div class="overlay" id="overlay-troca">
  <div class="overlay-box">
    <div class="overlay-handle"></div>
    <div class="overlay-title">🔄 Pedido de Troca</div>
    <div class="form-row">
      <div class="form-group"><label>Cede serviço</label>
        <select id="tr-req" onchange="updateTrocaDoc()">
          <option value="">— Selecionar —</option>
          <option value="DUARTE">Flávio Duarte</option>
          <option value="REIS">Elder Reis</option>
          <option value="FINO">Rui Fino</option>
          <option value="MORGADO">António Morgado</option>
          <option value="NUNES">Carlos Nunes</option>
          <option value="AFONSO">Miguel Afonso</option>
        </select>
      </div>
      <div class="form-group"><label>Data do serviço a ceder</label><input type="date" id="tr-date1" oninput="updateTrocaDoc()"></div>
      <div class="form-group"><label>Substituto</label>
        <select id="tr-sub" onchange="updateTrocaDoc()">
          <option value="">— Selecionar —</option>
          <option value="DUARTE">Flávio Duarte</option>
          <option value="REIS">Elder Reis</option>
          <option value="FINO">Rui Fino</option>
          <option value="MORGADO">António Morgado</option>
          <option value="NUNES">Carlos Nunes</option>
          <option value="AFONSO">Miguel Afonso</option>
        </select>
      </div>
      <div class="form-group"><label>Data de compensação</label><input type="date" id="tr-date2" oninput="updateTrocaDoc()"></div>
    </div>
    <div id="troca-preview" style="display:none" class="info-box info-blue"></div>
    <div id="troca-doc" style="display:none;margin-bottom:12px">
      <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px">Texto para copiar</div>
      <div id="troca-doc-text" style="background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.78rem;font-family:monospace;white-space:pre-wrap;line-height:1.5"></div>
      <button class="btn btn-outline" onclick="copiarTextoTroca()" style="margin-top:8px">📋 Copiar texto</button>
    </div>
    <button class="btn btn-green" onclick="submeterPedidoTrocaMobile()">📨 Submeter Pedido</button>
    <button class="btn btn-outline" onclick="closeOverlay('overlay-troca')">Cancelar</button>
  </div>
</div>

<!-- Situação -->
<div class="overlay" id="overlay-situacao">
  <div class="overlay-box">
    <div class="overlay-handle"></div>
    <div class="overlay-title">⚠️ Nova Situação</div>
    <div class="form-row">
      <div class="form-group"><label>Tipo</label>
        <select id="sit-tipo">
          <option value="Transporte de Órgãos">🚑 Transporte de Órgãos</option>
          <option value="Evento">🎯 Evento</option>
          <option value="Urgente">🚨 Urgente</option>
          <option value="Outro">📌 Outro</option>
        </select>
      </div>
      <div class="form-group"><label>Descrição</label><input type="text" id="sit-descricao" placeholder="Descreva a situação..."></div>
      <div class="form-group"><label>Data</label><input type="date" id="sit-data"></div>
      <div class="form-group"><label>Hora de início</label><input type="time" id="sit-hora"></div>
      <div class="form-group"><label>Militar</label>
        <select id="sit-militar">
          <option value="">— Todos —</option>
          <option value="DUARTE">Flávio Duarte</option>
          <option value="REIS">Elder Reis</option>
          <option value="FINO">Rui Fino</option>
          <option value="MORGADO">António Morgado</option>

// ═══════════════ API ═══════════════
function loadFromAPI() {
  showLoading(true);
  return new Promise((res,rej) => {
    const cbName = 'cb_'+Date.now();
    const script = document.createElement('script');
    window[cbName] = function(data) {
      delete window[cbName]; document.body.removeChild(script);
      showLoading(false);
      if(data.status==='ok' && data.schedule) {
        SCHEDULE = data.schedule;
        if(data.trocas) TROCAS = data.trocas;
        document.getElementById('api-status').textContent = '✓ Online';
        document.getElementById('api-status').style.background = 'rgba(39,174,96,.3)';
        document.getElementById('last-update').textContent = 'Actualizado: '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
        updateBanner();
        renderHistorico();
        checkApprovalUrl();
        checkFeriasUrl();
        res();
      } else { showLoading(false); updateBanner(); res(); }
    };
    script.onerror = function() { delete window[cbName]; document.body.removeChild(script); showLoading(false); updateBanner(); res(); };
    script.src = API_URL + '?action=get&callback='+cbName;
    document.body.appendChild(script);
  });
}

// ═══════════════ BANNER ═══════════════
function quemFazServico(dateStr) {
  for(const p of PEOPLE) { const v=((SCHEDULE[p]||{})[dateStr]||'').toUpperCase().trim(); if(v==='SV') return p; }
  for(const p of PEOPLE) { const v=((SCHEDULE[p]||{})[dateStr]||'').toUpperCase().trim(); if(v&&PEOPLE.includes(v)) return v; }
  return null;
}
function updateBanner() {
  const hoje = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  const hojeStr = fmt(hoje);
  const amanha = new Date(hoje); amanha.setDate(amanha.getDate()+1);
  const amanhaStr = fmt(amanha);
  const ontem = new Date(hoje); ontem.setDate(ontem.getDate()-1);
  const ontemStr = fmt(ontem);
  const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'});

  const emServico = quemFazServico(ontemStr);
  const entraHoje = quemFazServico(hojeStr);
  const entraAmanha = quemFazServico(amanhaStr);

  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  set('b-saindo', emServico ? (NOMES[emServico]||emServico).split(' ').pop() : '—');
  set('b-saindo-sub', emServico ? 'Termina hoje às 09h' : '—');
  set('b-hoje', entraHoje ? (NOMES[entraHoje]||entraHoje).split(' ').pop() : '—');
  set('b-hoje-sub', entraHoje ? fmtDate(hojeStr) : '—');
  set('b-amanha', entraAmanha ? (NOMES[entraAmanha]||entraAmanha).split(' ').pop() : '—');
  set('b-amanha-sub', entraAmanha ? fmtDate(amanhaStr) : '—');

  // situações
  const normData = v => { if(!v||v==='undefined') return ''; const d=new Date(v); if(!isNaN(d)&&d.getFullYear()>1900) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); return String(v).substring(0,10); };
  const normHora = v => { if(!v||v==='undefined') return ''; if(String(v).match(/^\d{1,2}:\d{2}/)) return String(v).substring(0,5); return ''; };
  const sitHoje = SITUACOES.filter(s => {
    if(s.estado!=='Pendente'&&s.estado!=='Em Progresso') return false;
    const nd=normData(s.data); if(!nd) return true;
    const diff=(new Date(nd+'T12:00:00')-hoje)/(1000*60*60*24);
    return diff>=-2&&diff<=3;
  });
  const rowSit = document.getElementById('banner-sit-row');
  if(rowSit) {
    if(sitHoje.length) {
      const tipoIcon=t=>t.includes('Órgão')?'🚑':t==='Evento'?'🎯':t==='Urgente'?'🚨':'📌';
      rowSit.style.display='flex';
      rowSit.innerHTML=sitHoje.map(s=>{
        const nh=normHora(s.hora); const nd=normData(s.data);
        const quando=nd===hojeStr?'Hoje'+(nh?' às '+nh:''):nd===amanhaStr?'Amanhã'+(nh?' às '+nh:''):'Pendente';
        return `<div style="flex:0 0 auto;padding:8px 12px;border-right:1px solid #FFE0B2"><div style="font-size:.6rem;font-weight:700;color:#E67E22">${tipoIcon(s.tipo)} ${s.tipo.toUpperCase()}</div><div style="font-size:.8rem;font-weight:700">${s.descricao}</div><div style="font-size:.65rem;color:#7A8A9A">${quando}</div></div>`;
      }).join('');
    } else {
      rowSit.style.display='none';
    }
  }
}

function runConsulta(silencioso=false) {
  const s=document.getElementById('start-date').value;
  const e=document.getElementById('end-date').value;
  if(!s||!e||!selectedPeople.length) { if(!silencioso) alert('Preencha as datas.'); return; }
  const rows=getEntries(s,e,selectedPeople,'all');
  const counts={SV:{},F:{},LP:{}};
  PEOPLE.forEach(p=>{counts.SV[p]=0;counts.F[p]=0;counts.LP[p]=0;});
  rows.forEach(r=>{ if(!r.troca&&counts[r.type]) counts[r.type][r.person]++; else if(r.troca&&!r.cedeu) counts.SV[r.person]++; });

  const sc=document.getElementById('stats-container');
  sc.innerHTML=`<div class="card"><div class="card-title">Totais no Período</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${
    selectedPeople.map(p=>`<div style="text-align:center;padding:8px;background:${COLORS[p]}12;border-radius:10px;border-top:3px solid ${COLORS[p]}">
      <div style="font-size:1.6rem;font-weight:700;color:${COLORS[p]}">${counts.SV[p]}</div>
      <div style="font-size:.65rem;font-weight:700;color:${COLORS[p]}">${p.charAt(0)+p.slice(1).toLowerCase()}</div>
      <div style="font-size:.6rem;color:var(--muted)">serviços</div>
    </div>`).join('')
  }</div></div>`;

  const rc=document.getElementById('results-container');
  if(!rows.length) { rc.innerHTML='<div class="empty-state">Sem resultados.</div>'; return; }
  rc.innerHTML = rows.map(r=>{
    const isTroca=r.troca;
    const cls=isTroca?'entry-troca':r.type==='SV'?'entry-sv':r.type==='F'?'entry-f':'entry-lp';
    const badge=isTroca?(r.cedeu?`↔ Cedeu a ${(NOMES[r.substituto]||r.substituto||'').split(' ')[0]}`:`↔ Fez por ${(NOMES[r.substituto]||r.substituto||'').split(' ')[0]}`):r.type==='SV'?'⚡ Serviço':r.type==='F'?'🏖️ Férias':'👶 LP';
    const badgeCls=isTroca?'badge-troca':r.type==='SV'?'badge-sv':r.type==='F'?'badge-f':'badge-lp';
    const d=new Date(r.date+'T12:00:00'); const isWk=d.getDay()===0||d.getDay()===6;
    const dayStr=d.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="entry-card ${cls}">
      <div class="entry-name" style="color:${COLORS[r.person]}">${NOMES[r.person]}</div>
      <div class="entry-date">${dayStr}${isWk?' · fim de semana':''}</div>
      <span class="entry-badge ${badgeCls}">${badge}</span>
    </div>`;
  }).join('');
}

function getEntries(startStr,endStr,people,typeFilter) {
  const rows=[]; const seen=new Set();
  let d=new Date(startStr+'T12:00:00'); const end=new Date(endStr+'T12:00:00');
  while(d<=end) {
    const ds=d.toISOString().split('T')[0];
    for(const p of people) {
      const val=(SCHEDULE[p]||{})[ds];
      if(!val) { d.setDate(d.getDate()+1); continue; }
      const v=String(val).trim().toUpperCase();
      const isTroca=PEOPLE.includes(v);
      const actualType=isTroca?'SV':v;
      if(typeFilter!=='all'&&actualType!==typeFilter) continue;
      const key=ds+p;
      if(seen.has(key)) continue; seen.add(key);
      if(isTroca) {
        rows.push({date:ds,person:p,val,type:'SV',troca:true,cedeu:true,substituto:v});
        const subKey=ds+v;
        if(people.includes(v)&&!seen.has(subKey)) {
          seen.add(subKey);
          rows.push({date:ds,person:v,val,type:'SV',troca:true,cedeu:false,substituto:p});
        }
      } else {
        rows.push({date:ds,person:p,val,type:actualType,troca:false,substituto:null});
      }
    }
    d.setDate(d.getDate()+1);
  }
  return rows;
}

// ═══════════════ CALENDÁRIO ═══════════════
function changeMonth(dir) { calMonth+=dir; if(calMonth>11){calMonth=0;calYear++;} if(calMonth<0){calMonth=11;calYear--;} buildCalendar(); }
function buildCalendar() {
  const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS=['D','S','T','Q','Q','S','S'];
  document.getElementById('cal-month-label').textContent=MESES[calMonth]+' '+calYear;

  // legenda
  const leg=document.getElementById('cal-legend');
  leg.innerHTML=PEOPLE.map(p=>`<span style="display:flex;align-items:center;gap:3px"><span style="width:10px;height:10px;border-radius:2px;background:${COLORS[p]};display:inline-block"></span><span>${p.charAt(0)+p.slice(1,4).toLowerCase()}</span></span>`).join('');

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();

  let html='<div class="cal-grid">';
  DIAS.forEach(d=>{ html+=`<div class="cal-day-hdr">${d}</div>`; });
  for(let i=0;i<firstDay;i++) html+='<div class="cal-day other-month"></div>';

  for(let d=1;d<=daysInMonth;d++) {
    const dt=new Date(calYear,calMonth,d);
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isWk=dt.getDay()===0||dt.getDay()===6;
    const isFer=FERIADOS_2027.has(ds);
    const cls=isFer?'cal-day feriado':isWk?'cal-day weekend':'cal-day';
    const dots=PEOPLE.filter(p=>((SCHEDULE[p]||{})[ds]||'').trim().toUpperCase()).map(p=>{
      const v=((SCHEDULE[p]||{})[ds]||'').trim().toUpperCase();
      const c=v==='F'?COLORS[p]:v==='LP'?COLORS[p]:v==='SV'||PEOPLE.includes(v)?COLORS[p]:'';
      const opacity=v==='F'?'.4':v==='LP'?'.6':'1';
      return c?`<div class="cal-dot" style="background:${c};opacity:${opacity}"></div>`:'';
    }).join('');
    html+=`<div class="${cls}" onclick="showDayDetail('${ds}')"><div class="cal-day-num">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }
  html+='</div>';
  document.getElementById('cal-grid').innerHTML=html;
}

function showDayDetail(ds) {
  const el=document.getElementById('cal-day-detail');
  const d=new Date(ds+'T12:00:00');
  const dayStr=d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const entries=PEOPLE.map(p=>{
    const v=((SCHEDULE[p]||{})[ds]||'').trim().toUpperCase();
    if(!v) return '';
    const isTroca=PEOPLE.includes(v);

    const bg=v==='F'?'#f0e6ff':v==='LP'?'#e6f0ff':isTroca?'#fff3e6':'#e6f9ef';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${bg};border-radius:10px;margin-bottom:6px">
      <span style="font-weight:700;color:${COLORS[p]}">${NOMES[p]}</span>

}

          ${podeCancel?`<button onclick="cancelarPeriodo('${f.id}')" style="margin-top:8px;background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:5px 12px;font-size:.72rem;cursor:pointer;width:100%">🗑 Cancelar pedido</button>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  el.innerHTML=html;
}
function calcularDiasUteis() {
  const ini=document.getElementById('fer-inicio').value;
  const fim=document.getElementById('fer-fim').value;
  const mil=FERIAS_USER;
  const el=document.getElementById('fer-calculo');
  if(!ini||!fim) { el.textContent=''; return; }
  let d=new Date(ini+'T12:00:00'); const fimD=new Date(fim+'T12:00:00');
  if(d>fimD) { el.innerHTML='<span style="color:var(--red)">⚠ Data início posterior ao fim</span>'; return; }
  let uteis=0; let dc=new Date(d);
  while(dc<=fimD) { if(dc.getDay()!==0&&dc.getDay()!==6&&!FERIADOS_2027.has(dc.toISOString().split('T')[0])) uteis++; dc.setDate(dc.getDate()+1); }
  const restantes=mil&&FERIAS_RESUMO[mil]?FERIAS_RESUMO[mil].diasRestantes:'?';
  const cor=uteis<10?'#E67E22':uteis<=restantes?'#27AE60':'#C0392B';
  const aviso=uteis>restantes?' ⚠ Excede dias disponíveis':'';
  const nota=uteis<10?' (nota: mínimo 10 dias num período)':'';
  el.innerHTML=`<span style="color:${cor};font-weight:700">${uteis} dias úteis${aviso}</span><span style="color:var(--muted);font-size:.75rem">${nota}</span>`;
}
function submeterFerias() {
  const mil=FERIAS_USER;
  const ini=document.getElementById('fer-inicio').value;

  const obs=document.getElementById('fer-obs').value;

    else { alert('Erro: '+(d.error||'desconhecido')); }

function cancelarPeriodo(id) {

        const isWk=dt.getDay()===0||dt.getDay()===6; const isFer=FERIADOS_2027.has(ds);

function exportPDF(){

  if(!s||!e||!people.length){ alert('Selecione datas e pelo menos um militar.'); return; }

  const MESES_PT2=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS_PT2={0:'D',1:'S',2:'T',3:'Q',4:'Q',5:'S',6:'S'};
  const COL_SV2='#92D050'; const COL_F2='#B18CD9'; const COL_LP2='#6FA8DC'; const COL_WK2='#BFBFBF';

  const start_d=new Date(s+'T12:00:00'); const end_d=new Date(e+'T12:00:00');
  const ds=start_d.toLocaleDateString('pt-PT'); const de=end_d.toLocaleDateString('pt-PT');

  // agrupar por mês
  const months={};
  let d=new Date(start_d);
  while(d<=end_d){
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!months[key]) months[key]={year:d.getFullYear(),month:d.getMonth(),days:[]};
    months[key].days.push(new Date(d));
    d.setDate(d.getDate()+1);
  }

  let tablesHtml='';

        cells+=`<td style="background:${bg};border:1px solid #bbb;text-align:center;font-size:7px;font-weight:${fw};color:${color};padding:1px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact">${txt}</td>`;

        ${cells}
      </tr>`;
    }

    tablesHtml+=`<div style="margin-bottom:16px;page-break-inside:avoid">
      <div style="background:#C00000;color:#fff;text-align:center;font-weight:700;font-size:10px;padding:4px;letter-spacing:.1em">${MESES_PT2[month].toUpperCase()} ${year}</div>
      <table style="border-collapse:collapse;width:100%;table-layout:fixed">

  }

  const content=`<div style="font-family:'Calibri',Arial,sans-serif;color:#000;max-width:100%">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;letter-spacing:.05em">ESCALA DE SERVIÇO — OPERADORES DE TRÂNSITO 2026</div>
      <div style="font-size:10px;color:#555;margin-top:3px">Período: ${ds} a ${de} · Gerado em ${new Date().toLocaleDateString('pt-PT')}</div>
